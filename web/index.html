
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="hussh helps you inspect suspicious messages and understand the evidence.">
    <title>huSSh · Message checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="brand" href="#check">
        <span class="logo">h</span>
        hu<span class="highlight-ss">SS</span>h<span class="dot">.</span>
    </a>

        <div class="workspace">YOUR SAFETY WORKSPACE</div>

        <nav>
            <button data-page="check" class="active">
                <span>◈</span> Message checker
            </button>

            <button data-page="community">
                <span>◎</span> Community feed
            </button>

            <button data-page="history">
                <span>↶</span> Saved history
            </button>

            <button data-page="review">
                <span>▣</span> Trusted review
            </button>
        </nav>

        <div class="sidebar-bottom">
            <div class="privacy-icon">◇</div>
            <strong>Your messages. Your choice.</strong>
            <p>
                Only analyse what you choose to share.
                Saving is always optional.
            </p>

            <button class="text-button" data-page="about">
                Privacy &amp; how it works ↗
            </button>
        </div>

        <button class="profile" id="account">
            <span class="avatar">Y</span>
            <span>
                <b>Your workspace</b>
                <small id="account-label">Browser demo</small>
            </span>
            <span>⌄</span>
        </button>
    </aside>

    <div class="shell">
        <header>
            <div>
                <span class="breadcrumb">Workspace</span>
                <span class="slash">/</span>
                <span id="crumb">Message checker</span>
            </div>

            <span class="demo-badge" id="mode">
                ● Interactive demo
            </span>
        </header>

        <main id="main"></main>

        <footer>
            <span>huSSh · Pause. Check. Stay in control.</span>
            <span>Risk estimates are guidance, never a guarantee.</span>
        </footer>
    </div>

    <dialog id="modal">
        <button class="close" aria-label="Close dialog">×</button>
        <div id="modal-body"></div>
    </dialog>

    <div id="toast" role="status"></div>

    <script src="app.js"></script>
</body>

</html>
